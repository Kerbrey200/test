name: evo-core

on:
  push:
    paths:
      - 'evo-core/**'
      - '.github/workflows/evo-core.yml'
  pull_request:
    paths:
      - 'evo-core/**'
      - '.github/workflows/evo-core.yml'

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']
    defaults:
      run:
        working-directory: evo-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run test suite
        run: npm test
      - name: Verify the suite left the repository untouched
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
